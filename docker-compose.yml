services:
  backend:
    build:
      context: ./01-backend
      dockerfile: Dockerfile
    container_name: aegistrace-backend
    ports:
      - "8000:8000"
    environment:
      - ENV=development
      - DEMO_MODE=true
      - DATABASE_URL=sqlite:///./database/aegistrace.db
      - API_HOST=0.0.0.0
      - API_PORT=8000
    volumes:
      - ./database:/app/database
    restart: unless-stopped

